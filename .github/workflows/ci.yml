name: Linux application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf git python3 curl xvfb libfuse2t64
      - name: Install pinned Rust
        run: rustup show
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Check prerequisites
        run: pnpm run doctor
      - name: Build production application
        run: pnpm build
      - name: Verify source and tests
        run: pnpm check
      - name: Package AppImage
        run: pnpm package
      - name: Verify packaged application
        run: pnpm test:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-x86_64-verification
          include-hidden-files: true
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            .cache/package-smoke/*.log
            playwright-report/
